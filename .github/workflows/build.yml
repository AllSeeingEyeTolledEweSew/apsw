name: build

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      publish:
        description: Write 'PUBLISH' to publish to pypi. BEWARE! ARTIFACTS ARE IMMUTABLE AND CANNOT BE REPLACED ONCE PUBLISHED!
      publish_test:
        description: Write 'PUBLISH_TEST' to publish to test-pypi. BEWARE! ARTIFACTS ARE IMMUTABLE AND CANNOT BE REPLACED ONCE PUBLISHED!

jobs:

  configure_matrix:
    runs-on: ubuntu-latest
    env:
      # github actions syntax doesn't allow us to have yaml structures as
      # an input to a job. These environment variables are literal json strings
      MATRIX_PULL_REQUEST: |
        {
          "include": [
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-manylinux_*", "CIBW_ARCHS": "x86_64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-musllinux_*", "CIBW_ARCHS": "x86_64"},
            {"os": "macos-10.15", "CIBW_BUILD": "cp37-*", "CIBW_ARCHS": "x86_64"},
            {"os": "windows-2019", "CIBW_BUILD": "cp37-*", "CIBW_ARCHS": "AMD64"}
          ]
        }
      MATRIX_WORKFLOW_DISPATCH: |
        {
          "include": [
            {"os": "ubuntu-20.04", "CIBW_BUILD": "*-manylinux_*", "CIBW_ARCHS": "x86_64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "*-manylinux_*", "CIBW_ARCHS": "i686"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp36-manylinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-manylinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp38-manylinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp39-manylinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp310-manylinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp36-manylinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-manylinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp38-manylinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp39-manylinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp310-manylinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp36-manylinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-manylinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp38-manylinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp39-manylinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp310-manylinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "*-musllinux_*", "CIBW_ARCHS": "x86_64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "*-musllinux_*", "CIBW_ARCHS": "i686"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp36-musllinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-musllinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp38-musllinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp39-musllinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp310-musllinux_*", "CIBW_ARCHS": "aarch64"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp36-musllinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-musllinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp38-musllinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp39-musllinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp310-musllinux_*", "CIBW_ARCHS": "ppc64le"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp36-musllinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp37-musllinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp38-musllinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp39-musllinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "ubuntu-20.04", "CIBW_BUILD": "cp310-musllinux_*", "CIBW_ARCHS": "s390x"},
            {"os": "macos-10.15", "CIBW_BUILD": "*", "CIBW_ARCHS": "x86_64"},
            {"os": "windows-2019", "CIBW_BUILD": "*", "CIBW_ARCHS": "x86"},
            {"os": "windows-2019", "CIBW_BUILD": "*", "CIBW_ARCHS": "AMD64"}
          ]
        }

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
    - id: set-matrix
      run: |
        if [ $GITHUB_EVENT_NAME == "pull_request" ]; then
          echo ::set-output name=matrix::$(echo $MATRIX_PULL_REQUEST | jq -c)
        else
          echo ::set-output name=matrix::$(echo $MATRIX_WORKFLOW_DISPATCH | jq -c)
        fi

  wheels:
    needs: configure_matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure_matrix.outputs.matrix) }}

    env:
      CIBW_BUILD_VERBOSITY: 1
      CIBW_BUILD: ${{ matrix.CIBW_BUILD }}
      CIBW_ARCHS: ${{ matrix.CIBW_ARCHS }}

    steps:
      - uses: actions/checkout@v2

      - uses: actions/cache@v2
        id: cache-wheel
        with:
          path: wheelhouse
          key: wheel-${{ matrix.CIBW_BUILD }}-${{ matrix.CIBW_ARCHS }}-${{ github.sha }}

      - uses: docker/setup-qemu-action@v1
        if: steps.cache-wheel.outputs.cache-hit != 'true' && runner.os == 'Linux'

      - uses: pypa/cibuildwheel@v2.2.2
        if: steps.cache-wheel.outputs.cache-hit != 'true'

      - uses: actions/upload-artifact@v2
        with:
          name: dist
          path: ./wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2

      - run: python setup.py fetch --all sdist

      - uses: actions/upload-artifact@v2
        with:
          name: dist
          path: ./dist/*.tar.gz

  upload_pypi:
    needs: [ wheels, sdist ]
    runs-on: ubuntu-latest
    if: needs.wheels.result == 'success' && needs.sdist.result == 'success' && github.event.inputs.publish == 'PUBLISH_TEST'

    steps:
    - uses: actions/download-artifact@v2
      with:
        name: dist
        path: dist

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true

  upload_pypi_test:
    needs: [ wheels, sdist ]
    runs-on: ubuntu-latest
    if: needs.wheels.result == 'success' && needs.sdist.result == 'success' && github.event.inputs.publish == 'PUBLISH'

    steps:
    - uses: actions/download-artifact@v2
      with:
        name: dist
        path: dist

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        skip_existing: true
        repository_url: https://test.pypi.org/legacy/
